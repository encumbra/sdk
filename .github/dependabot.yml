version: 2
updates:
  - package-ecosystem: npm          # covers pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Matches pnpm minimumReleaseAge: 4320 (3 days). Applies to version updates only;
    # security updates are never delayed.
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
